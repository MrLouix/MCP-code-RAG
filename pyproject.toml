[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-code-rag"
version = "0.1.0"
description = "Code analysis and semantic search via MCP"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MCP Code RAG Contributors"}
]

dependencies = [
    "fastmcp>=1.0.0",
    "chromadb>=0.4.0",
    "watchdog>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mcp-code-rag = "mcp_code_rag.server:main"

[tool.setuptools]
packages = ["mcp_code_rag", "mcp_code_rag.tagging", "mcp_code_rag.watcher", "mcp_code_rag.utils"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mcp_code_rag --cov-report=term-missing"
